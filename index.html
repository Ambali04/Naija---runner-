<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b16"><title>Naija Runner</title>
<style>
:root{--green:#087443;--gold:#ffc928;--red:#e84d3d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b16;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#82c9e9 0%,#d3e6c7 37%,#547b48 38%,#163d28 100%)}
.skyline{position:absolute;inset:20% 0 auto;height:26%;display:flex;align-items:end;justify-content:space-around;opacity:.9}
.building{width:12%;height:75%;background:#c47c48;border:2px solid #8b4d2d;box-shadow:inset 0 0 0 3px #dca36c;position:relative}
.building:nth-child(2n){height:95%;background:#d6b66e}.building:nth-child(3n){height:55%;background:#a96d52}
.building:after{content:"";position:absolute;inset:10% 12%;background:repeating-linear-gradient(90deg,#384b53 0 8px,transparent 8px 17px),repeating-linear-gradient(0deg,transparent 0 15px,#384b53 15px 22px)}
#road{position:absolute;bottom:-3%;left:50%;width:110%;height:77%;transform:translateX(-50%);background:#42494c;clip-path:polygon(37% 0,63% 0,100% 100%,0 100%);overflow:hidden}
.road-edge{position:absolute;bottom:0;width:3%;height:100%;background:#f6d45a}
.lane-line{position:absolute;top:-20%;height:130%;width:1.3%;left:49.35%;background:repeating-linear-gradient(to bottom,#f7f0c7 0 30px,transparent 30px 65px);transform-origin:top;opacity:.95}
.lane-line.left{left:39%;transform:perspective(180px) rotateX(16deg) scaleX(.6)}
.lane-line.right{left:59%;transform:perspective(180px) rotateX(16deg) scaleX(.6)}
.road-label{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);font-weight:900;letter-spacing:3px;color:#f8f1d5;font-size:clamp(10px,2.4vw,17px);opacity:.8}
#objects{position:absolute;inset:0;pointer-events:none}
.obj{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:clamp(28px,7vw,58px);filter:drop-shadow(0 5px 2px #17221b);line-height:1;white-space:nowrap}
.obj .label{display:block;font-size:9px;text-align:center;font-weight:900;color:white;text-shadow:0 2px 3px black}
#player{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);font-size:clamp(44px,11vw,76px);filter:drop-shadow(0 5px 2px #17221b);z-index:5;transition:left .12s}
.hud{position:absolute;top:env(safe-area-inset-top,10px);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;z-index:10;pointer-events:none}
.pill{background:#061c16dc;border:1px solid #ffffff42;border-radius:14px;padding:8px 11px;font-size:13px;font-weight:800;box-shadow:0 3px 12px #0002}
#message{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#03130edb;padding:22px;text-align:center}
.panel{max-width:420px;width:100%;background:linear-gradient(145deg,#0e5539,#09291f);border:2px solid #e4bd35;border-radius:24px;padding:24px 18px;box-shadow:0 18px 50px #0008}
.logo{font-size:clamp(36px,10vw,58px);font-weight:1000;letter-spacing:-2px;line-height:1;color:#ffce32;text-shadow:3px 4px #8c4e12}
.panel p{line-height:1.5;color:#e4f2e9}.btn{border:0;border-radius:13px;background:#ffcc31;color:#16251b;font-weight:950;font-size:17px;padding:14px 22px;width:100%;box-shadow:0 4px #a77714}
.small{font-size:12px;color:#d6e6dc;margin-top:12px}
#controls{position:absolute;bottom:2.5%;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:8;pointer-events:none}
.ctrl{width:55px;height:48px;border-radius:14px;border:1px solid #ffffff55;background:#061c16aa;color:white;font-size:22px;font-weight:900;pointer-events:auto}
.hidden{display:none!important}
#toast{position:absolute;z-index:12;top:22%;left:50%;transform:translateX(-50%);background:#071b16e8;border:1px solid #ffce32;border-radius:20px;padding:8px 14px;font-weight:900;opacity:0;transition:opacity .2s}
</style></head>
<body>
<div id="game" aria-label="Naija Runner game">
<div class="skyline"><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div></div>
<div id="road"><div class="road-edge" style="left:0"></div><div class="road-edge" style="right:0"></div><div class="lane-line left"></div><div class="lane-line"></div><div class="lane-line right"></div><div class="road-label">NAIJA STREETS</div></div>
<div id="objects"></div><div id="player">🏃🏿</div>
<div class="hud"><div class="pill">🏆 SCORE <span id="score">0</span></div><div class="pill">🪙 ₦ <span id="coins">0</span></div><div class="pill">⚡ <span id="speed">1x</span></div></div>
<div id="toast">+1 Naira coin!</div>
<div id="controls"><button class="ctrl" id="left" aria-label="Move left">◀</button><button class="ctrl" id="jump" aria-label="Jump">⬆</button><button class="ctrl" id="right" aria-label="Move right">▶</button></div>
<div id="message"><div class="panel"><div class="logo">NAIJA<br>RUNNER 🇳🇬</div><p>Run the streets! Dodge danfo, keke, okada, bicycles and taxis. Avoid potholes and collect Naira coins as you race through Nigeria.</p><button class="btn" id="start">START RUNNING</button><div class="small">Swipe left/right to change lanes • Swipe up to jump<br>Prototype game — more Nigerian cities coming!</div></div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), objects=$('objects'), player=$('player'), message=$('message');
let lane=1,score=0,coins=0,running=false,over=false,last=0,spawn=0,items=[],speed=1,jumpUntil=0;
const vehicles=[['🚌','DANFO'],['🛺','KEKE'],['🏍️','OKADA'],['🚲','BICYCLE'],['🚕','TAXI'],['🚧','ROADWORK'],['🕳️','POTHOLE'],['🪙','COIN'],['🛻','BUS']];
function laneX(l){return [35,50,65][l]+'%'}
function updatePlayer(){player.style.left=laneX(lane)}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));updatePlayer()}
function spawnItem(){
 const isCoin=Math.random()<.32, data=isCoin?['🪙','COIN']:vehicles[Math.floor(Math.random()*vehicles.length)];
 let l=Math.floor(Math.random()*3); const el=document.createElement('div');el.className='obj';el.innerHTML=data[0]+'<span class="label">'+(data[1])+'</span>';
 objects.appendChild(el);items.push({el,l,y:-5,type:data[1],hit:false});
}
function showToast(t){$('toast').textContent=t;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,550)}
function finish(){running=false;over=true;message.classList.remove('hidden');message.querySelector('.logo').innerHTML='OYA!<br>RUN ENDED';message.querySelector('p').innerHTML=`You scored <b>${score}</b> points and collected <b>${coins}</b> Naira coins. Ready for another run?`; $('start').textContent='RUN AGAIN';}
function reset(){items.forEach(o=>o.el.remove());items=[];lane=1;score=0;coins=0;speed=1;spawn=0;over=false;last=0;$('score').textContent=0;$('coins').textContent=0;$('speed').textContent='1x';updatePlayer();message.classList.add('hidden');running=true;requestAnimationFrame(loop)}
function loop(t){if(!running)return;if(!last)last=t;let dt=Math.min(40,t-last);last=t;spawn+=dt;speed=1+score/900;$('speed').textContent=speed.toFixed(1)+'x';score+=Math.floor(dt/40);$('score').textContent=score;
 if(spawn>Math.max(420,900-score*.25)){spawn=0;spawnItem()}
 for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=dt*.00004*speed*100;o.el.style.top=o.y+'%';o.el.style.left=laneX(o.l);let scale=.45+o.y/75;o.el.style.fontSize=(Math.min(1.7,scale)*7)+'vw';
 if(o.y>77&&!o.hit&&o.l===lane){o.hit=true;if(o.type==='COIN'){coins++;$('coins').textContent=coins;showToast('🪙 +1 Naira coin!');o.el.remove();items.splice(i,1);continue}else if(o.type==='POTHOLE'||o.type==='ROADWORK'){if(performance.now()>jumpUntil){finish();return}}else{finish();return}}
 if(o.y>112){o.el.remove();items.splice(i,1)}}
 requestAnimationFrame(loop)}
$('start').addEventListener('click',reset);$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));$('jump').addEventListener('click',()=>{if(running){jumpUntil=performance.now()+650;player.style.transform='translateX(-50%) translateY(-65px)';setTimeout(()=>player.style.transform='translateX(-50%)',650)}});
let sx=0,sy=0;const game=$('game');game.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});game.addEventListener('touchend',e=>{if(!running)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)$('jump').click()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ') $('jump').click()});
updatePlayer();
})();
</script></body></html>
